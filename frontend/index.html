<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiber Network System</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<!-- ─── Sidebar ──────────────────────────────────────────────────────────── -->
<aside class="sidebar">
    <div class="sidebar-brand">⬡ <span>Fiber</span> Network</div>
    <nav class="sidebar-nav">
        <div class="nav-item active" data-page="dashboard">
            <span class="nav-icon">📊</span>
            <span data-i18n="nav_dashboard">Dashboard</span>
        </div>
        <div class="nav-item" data-page="nodes">
            <span class="nav-icon">🔵</span>
            <span data-i18n="nav_nodes">Gestión de Nodos</span>
        </div>
        <div class="nav-item" data-page="links">
            <span class="nav-icon">🔗</span>
            <span data-i18n="nav_links">Gestión de Enlaces</span>
        </div>
        <div class="nav-item" data-page="reports">
            <span class="nav-icon">📋</span>
            <span data-i18n="nav_reports">Reportes</span>
        </div>
    </nav>
    <div class="sidebar-footer">Fiber Network Management v2.0</div>
</aside>

<!-- ─── Main ─────────────────────────────────────────────────────────────── -->
<div class="main-wrap">

    <!-- Topbar -->
    <header class="topbar">
        <button class="theme-toggle" id="theme-toggle" title="Toggle dark mode">🌙</button>
        <div class="lang-dropdown" id="lang-dropdown">
            <button class="lang-trigger" id="lang-trigger">
                🌐 <span id="lang-current">ES</span> <span class="lang-arrow">▾</span>
            </button>
            <div class="lang-menu" id="lang-menu">
                <button class="lang-option" id="btn-es">🇪🇸 Español</button>
                <button class="lang-option" id="btn-en">🇺🇸 English</button>
            </div>
        </div>
    </header>

    <!-- Page content -->
    <main class="page-content" id="page-content">
        <div class="loading">...</div>
    </main>

</div>

<!-- ─── Modal (shared) ───────────────────────────────────────────────────── -->
<div class="modal-overlay" id="modal-overlay" style="display:none">
    <div class="modal">
        <h3 id="modal-msg"></h3>
        <div class="modal-actions">
            <button class="btn btn-outline" id="modal-cancel"></button>
            <button class="btn btn-danger"  id="modal-confirm"></button>
        </div>
    </div>
</div>

<!-- ─── Scripts ──────────────────────────────────────────────────────────── -->
<!-- Chart.js from CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<script src="/js/i18n.js"></script>
<script src="/js/api.js"></script>
<script src="/js/pages/dashboard.js"></script>
<script src="/js/pages/nodes.js"></script>
<script src="/js/pages/links.js"></script>
<script src="/js/pages/reports.js"></script>

<script>
// ─── Helpers ──────────────────────────────────────────────────────────────
function typeClass(nodeType) {
    if (nodeType === "Central")      return "type-central";
    if (nodeType === "Distribución") return "type-distribution";
    if (nodeType === "Acceso")       return "type-access";
    if (nodeType === "Terminal")     return "type-terminal";
    return "default";
}

function statusClass(status) {
    if (status === "Activo"   || status === "Active")      return "success";
    if (status === "Inactivo" || status === "Inactive")    return "danger";
    if (status === "Mantenimiento" || status === "Maintenance") return "warning";
    return "default";
}

function showToast(msg) {
    const el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
}

function sortArray(arr, col, dir) {
    if (!col) return arr;
    return [...arr].sort((a, b) => {
        let va = a[col] ?? "";
        let vb = b[col] ?? "";
        if (typeof va === "string") va = va.toLowerCase();
        if (typeof vb === "string") vb = vb.toLowerCase();
        return va < vb ? -dir : va > vb ? dir : 0;
    });
}

function confirmDialog(message, confirmText, onConfirm) {
    const overlay = document.getElementById("modal-overlay");
    document.getElementById("modal-msg").textContent     = message;
    document.getElementById("modal-cancel").textContent  = I18n.t("btn_cancel");
    document.getElementById("modal-confirm").textContent = confirmText;
    overlay.style.display = "flex";
    document.getElementById("modal-cancel").onclick  = () => overlay.style.display = "none";
    document.getElementById("modal-confirm").onclick = () => { overlay.style.display = "none"; onConfirm(); };
}

function confirmDelete(message, onConfirm) {
    confirmDialog(message, I18n.t("btn_confirm_delete"), onConfirm);
}

function hasOpenForm() {
    const nodeArea = document.getElementById("node-form-area");
    const linkArea = document.getElementById("link-form-area");
    return (nodeArea?.innerHTML.trim() !== "") || (linkArea?.innerHTML.trim() !== "");
}

// ─── Router ───────────────────────────────────────────────────────────────
const PAGES = { dashboard: renderDashboard, nodes: renderNodes, links: renderLinks, reports: renderReports };
let currentPage = "dashboard";

async function navigate(page) {
    currentPage = page;
    document.querySelectorAll(".nav-item").forEach(el => {
        el.classList.toggle("active", el.dataset.page === page);
    });
    const container = document.getElementById("page-content");
    container.innerHTML = `<div class="loading">...</div>`;
    await PAGES[page](container);
}

document.querySelectorAll(".nav-item").forEach(el => {
    el.addEventListener("click", () => {
        const page = el.dataset.page;
        if (hasOpenForm()) {
            confirmDialog(I18n.t("unsaved_changes"), I18n.t("btn_discard"), () => navigate(page));
        } else {
            navigate(page);
        }
    });
});

// ─── i18n ─────────────────────────────────────────────────────────────────
function applyI18n() {
    document.querySelectorAll("[data-i18n]").forEach(el => {
        el.textContent = I18n.t(el.dataset.i18n);
    });
    const lang = I18n.currentLang();
    document.getElementById("lang-current").textContent = lang.toUpperCase();
    document.getElementById("btn-es").classList.toggle("active", lang === "es");
    document.getElementById("btn-en").classList.toggle("active", lang === "en");
}

async function setLang(lang) {
    await I18n.load(lang);
    applyI18n();
    closeLangMenu();
    navigate(currentPage);
}

// Dropdown toggle
const langTrigger = document.getElementById("lang-trigger");
const langMenu    = document.getElementById("lang-menu");

function closeLangMenu() { langMenu.classList.remove("open"); }

langTrigger.addEventListener("click", (e) => {
    e.stopPropagation();
    langMenu.classList.toggle("open");
});
document.addEventListener("click", closeLangMenu);

document.getElementById("btn-es").addEventListener("click", () => setLang("es"));
document.getElementById("btn-en").addEventListener("click", () => setLang("en"));

// ─── Dark mode ────────────────────────────────────────────────────────────
function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    document.getElementById("theme-toggle").textContent = theme === "dark" ? "☀️" : "🌙";
}

document.getElementById("theme-toggle").addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    localStorage.setItem("theme", next);
    applyTheme(next);
});

// ─── Boot ─────────────────────────────────────────────────────────────────
(async () => {
    applyTheme(localStorage.getItem("theme") || "light");
    const savedLang = localStorage.getItem("lang") || "es";
    await I18n.load(savedLang);
    applyI18n();
    await navigate("dashboard");
})();
</script>

</body>
</html>
